<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sausage Bird and Friends</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="branding">
	<img src="Images/Banners/banner.jpg">
  </header>
    <div id="comic-container">
        <img id="comic" src="" alt="Comic page">
    </div>

    <div id="caption"></div>
    <div id="controls">
	  <button id="prev-btn" class="icon-btn" aria-label="Previous">
		<img class="icon" src="Images/Buttons/previous.jpg" alt="">
	  </button>
      <button id="random-btn" class="icon-btn" aria-label="random">
		<img class="icon" src="Images/Buttons/random.jpg" alt="">
	  </button>
      <button id="next-btn" class="icon-btn" aria-label="Next">
		<img class="icon" src="Images/Buttons/next.jpg" alt="">
	  </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
